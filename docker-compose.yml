services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "300", "1", "--maxmemory", "1gb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: indra-ocr:2.0.0
    environment:
      REDIS_URL: redis://redis:6379/0
      INDRA_API_KEY: "${INDRA_API_KEY:-}"   # 空=不鉴权；公开部署务必设置
      MAX_QUEUE: "${MAX_QUEUE:-1000}"       # 队列上限，超出返回 429（背压）
      TMPDIR: /tmp/indra
      HF_HOME: /opt/models
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./tmp:/tmp/indra                    # 与 worker 共享：上传文件落这里
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  worker:
    build: .
    image: indra-ocr:2.0.0
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      OCR_THREADS: "${OCR_THREADS:-8}"      # 每个 worker 占用的线程/核数
      HF_HOME: /opt/models
      HF_HUB_OFFLINE: "1"
      TMPDIR: /tmp/indra
    volumes:
      - ./models:/opt/models:ro             # 只读挂载离线模型
      - ./tmp:/tmp/indra                    # 与 api 共享：读上传文件、写结果
    depends_on:
      redis:
        condition: service_healthy
    # 横向扩容：replicas = floor(机器核数 / OCR_THREADS)
    # 例：32 核 / OCR_THREADS=8 → 4 个 worker 副本
    deploy:
      replicas: 4
      resources:
        limits:
          cpus: "8.0"                       # 每个副本限 8 核（= OCR_THREADS）
          memory: 2G
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
