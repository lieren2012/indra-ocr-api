services:
  redis:
    image: redis:7-alpine
    # AOF 每秒落盘（掉电最多丢 ~1s 写入）+ noeviction：
    # 内存满时"写失败而非淘汰队列/任务/心跳"，API 会返回 503 让调用方重试，绝不静默丢数据。
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "900", "1", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    image: indra-ocr:2.1.0
    environment:
      REDIS_URL: redis://redis:6379/0
      INDRA_API_KEY: "${INDRA_API_KEY:-}"   # 空=不鉴权；公开部署务必设置
      MAX_QUEUE: "${MAX_QUEUE:-1000}"       # 队列上限，超出返回 429（背压）
      TMPDIR: /tmp/indra
      HF_HOME: /opt/models
      HF_HUB_OFFLINE: "1"
    volumes:
      - ./tmp:/tmp/indra                    # 与 worker 共享：上传文件落这里
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 用 /readyz 而非 /healthz：无在线 worker 时返回 503 → Docker 不会显示"假健康"
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  worker:
    build: .
    image: indra-ocr:2.1.0
    command: ["python", "worker.py"]
    environment:
      REDIS_URL: redis://redis:6379/0
      OCR_THREADS: "${OCR_THREADS:-8}"      # 每个 worker 占用的线程/核数
      HF_HOME: /opt/models
      HF_HUB_OFFLINE: "1"
      TMPDIR: /tmp/indra
    volumes:
      - ./models:/opt/models:ro             # 只读挂载离线模型
      - ./tmp:/tmp/indra                    # 与 api 共享：读上传文件、写结果
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # 校验本 worker 自己的心跳：模型没加载好 / 进程卡死 → 心跳缺失 → unhealthy
      test: ["CMD", "python", "worker_healthcheck.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    # 默认只有 1 个 worker（不写死 replicas）。要更多副本可：
    #   docker compose up -d --scale worker=4
    # 或跑 scripts/autoscale.sh 按队列积压自动在 1~4 之间伸缩。
    deploy:
      resources:
        limits:
          cpus: "8.0"                       # 每个副本限 8 核（= OCR_THREADS）
          memory: 2G
    stop_grace_period: 300s                 # 长任务也能处理完再退出（配合优雅退出）
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    restart: unless-stopped
