worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 并发连接限制（防瞬间百文档冲垮内存），而非速率限制。
    # 对"半小时批量导入 100 文档"这种合法突发，限制"同时在处理的数量"
    # 比限制"每秒进来的速率"更合适：允许请求快速涌入，最多 16 个同时处理。
    limit_conn_zone $binary_remote_addr zone=indraconn:10m;

    upstream indra_backend {
        server ocr:8000;
    }

    server {
        listen 80;
        client_max_body_size 50m;        # 限制上传体积（知识库文档足够）

        limit_conn indraconn 16;         # 同一来源最多 16 个并发上传连接

        location / {
            proxy_pass http://indra_backend;
            proxy_read_timeout 300s;     # 大 PDF 异步处理需放宽
            proxy_connect_timeout 10s;
            proxy_send_timeout 300s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
