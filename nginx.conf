worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # 并发连接限制（防瞬间海量上传冲垮后端），而非速率限制。
    # 允许请求快速涌入、入队后立即返回，真正扛 OCR 的是后台 Worker 池。
    limit_conn_zone $binary_remote_addr zone=indraconn:10m;
    # 简单全局速率兜底：每来源 50 r/s（突发 100），避免单 IP 疯狂刷
    limit_req_zone $binary_remote_addr zone=indrarate:10m rate=50r/s;

    upstream indra_backend {
        server api:8000;
    }

    server {
        listen 80;
        client_max_body_size 50m;        # 限制上传体积（知识库文档足够）

        limit_conn indraconn 64;         # 单来源最多 64 个并发连接
        limit_req zone=indrarate burst=100 nodelay;

        location / {
            proxy_pass http://indra_backend;
            proxy_read_timeout 60s;      # API 立即返回，不需要长超时
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
